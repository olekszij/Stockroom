<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stockroom — Mini WMS & Formation</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- App Header -->
  <header class="app-header">
    <div class="header-top">
      <div class="brand">
        <div class="brand-icon">S</div>
        <div>
          <span class="brand-title">Stockroom</span>
          <span class="brand-subtitle">WMS & Formation Entrepôt</span>
        </div>
      </div>
      <div class="header-actions">
        <button class="btn btn-secondary btn-sm" id="btn-text-size-toggle" data-action="toggle-text-size" title="Agrandir / réduire la taille du texte" aria-label="Agrandir / réduire la taille du texte">
          <svg class="ui-icon" viewBox="0 0 24 24"><path d="m3 16 4-10 4 10"/><path d="M5 12h4"/><path d="m15 16 3-7 3 7"/><path d="M16.5 13.5h3"/></svg>
          <span class="hide-mobile">Texte</span>
        </button>
        <button class="btn btn-secondary btn-sm hamburger-btn" id="btn-hamburger" data-action="toggle-mobile-menu" aria-label="Menu de navigation" aria-expanded="false" title="Menu">
          <svg class="ui-icon icon-hamburger" viewBox="0 0 24 24"><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></svg>
          <svg class="ui-icon icon-close" style="display: none;" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>
          <span class="hamburger-label">Menu</span>
        </button>
      </div>
    </div>

    <!-- Navigation Tabs (Dropdown drawer on small screens, horizontal bar on desktop) -->
    <div class="nav-bar-container">
      <nav class="nav-tabs" role="tablist" aria-label="Navigation principale">
        <button class="nav-tab-btn" role="tab" data-action="nav-tab" data-tab="formation" aria-controls="tab-content" aria-current="page">
          <svg class="ui-icon" viewBox="0 0 24 24"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg>
          <span>Formation</span>
          <span class="tab-badge" id="badge-training-progress">0/8</span>
        </button>
        <button class="nav-tab-btn" role="tab" data-action="nav-tab" data-tab="dashboard" aria-controls="tab-content">
          <svg class="ui-icon" viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></svg>
          <span>Tableau de bord</span>
        </button>
        <button class="nav-tab-btn" role="tab" data-action="nav-tab" data-tab="reception" aria-controls="tab-content">
          <svg class="ui-icon" viewBox="0 0 24 24"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>
          <span>Réception</span>
          <span class="tab-badge" id="badge-reception-count">0</span>
        </button>
        <button class="nav-tab-btn" role="tab" data-action="nav-tab" data-tab="expedition" aria-controls="tab-content">
          <svg class="ui-icon" viewBox="0 0 24 24"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>
          <span>Expédition</span>
          <span class="tab-badge" id="badge-expedition-count">0</span>
        </button>
        <button class="nav-tab-btn" role="tab" data-action="nav-tab" data-tab="stock" aria-controls="tab-content">
          <svg class="ui-icon" viewBox="0 0 24 24"><path d="m7.5 4.27 9 5.15"/><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg>
          <span>Stock</span>
        </button>
        <button class="nav-tab-btn" role="tab" data-action="nav-tab" data-tab="inventaire" aria-controls="tab-content">
          <svg class="ui-icon" viewBox="0 0 24 24"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M15 2H9a1 1 0 0 0-1 1v2a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V3a1 1 0 0 0-1-1z"/><path d="m9 14 2 2 4-4"/></svg>
          <span>Inventaire</span>
        </button>
      </nav>
    </div>
  </header>

  <!-- Mobile Menu Backdrop -->
  <div class="menu-backdrop" id="menu-backdrop" data-action="close-mobile-menu"></div>

  <!-- Main View Container -->
  <main class="app-container" id="app" role="main"></main>

  <!-- Floating Test Results Panel (hidden by default unless #tests or triggered) -->
  <div id="test-panel" style="display: none;"></div>

  <!-- SCRIPT SECTIONS:
       1. DATA SEED
       2. DOMAIN LOGIC
       3. TRAINING CONTENT
       4. RENDERING
       5. EVENTS
       6. SELF-TESTS
       7. BOOT
  -->
  <script src="app.js"></script>
</body>
</html>
